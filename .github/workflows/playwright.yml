name: Playwright Tests

on:
  push:
    branches: [ task_solution ]
  pull_request:
    branches: [ task_solution ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Install OpenJDK and Allure CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre-headless wget unzip
          npm install -g allure-commandline --unsafe-perm=true

      - name: Run Playwright tests with Allure
        env:
          HUNTD_BASE_URL: ${{ secrets.HUNTD_BASE_URL }}
        run: npx playwright test --reporter=allure-playwright

      - name: Generate Allure report
        run: allure generate allure-results -o allure-report --clean

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        with:
          name: junit-results
          path: test-results/results.xml
